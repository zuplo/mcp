name: Run Release
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Part of the semantic version number to increment (major | minor | patch)"
        type: choice
        default: minor
        required: true
        options: [major, minor, patch]

jobs:
  tag:
    name: Bump version & push tag
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: write

    steps:
      - name: Generate token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.INTEGRATIONS_APP_ID }}
          private-key: ${{ secrets.INTEGRATIONS_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: npm

      - name: Get latest tag
        id: latest_tag
        run: echo "tag=$(git describe --abbrev=0 --tags 2>/dev/null || echo '')" >> "$GITHUB_OUTPUT"

      - name: Bump semver tag
        id: bump_tag
        env:
          LATEST_TAG: ${{ steps.latest_tag.outputs.tag }}
          BUMP: ${{ inputs.bump }}
        run: |
          set -e
          base=${LATEST_TAG#v}
          if [[ -z "$base" ]]; then
            echo "No tag found. Exiting."
            exit 1
          fi
          IFS=. read -r maj min pat <<< "$base"
          case "$BUMP" in
            major) maj=$((maj + 1)); min=0; pat=0 ;;
            minor) min=$((min + 1)); pat=0 ;;
            patch) pat=$((pat + 1)) ;;
          esac
          next="$maj.$min.$pat"
          echo "next_version=$next" >> "$GITHUB_OUTPUT"
          echo "next_tag=v$next" >> "$GITHUB_OUTPUT"

      # Fail early with a clear message if the target tag already exists
      # remotely. Without this check the workflow would still bump
      # package.json and create a no-op commit, then die at the final
      # `git push origin <tag>` with a confusing 'rejected: already exists'
      # error. Catching it up front avoids the dirty intermediate state.
      - name: Verify tag does not already exist
        env:
          NEXT_TAG: ${{ steps.bump_tag.outputs.next_tag }}
        run: |
          if git ls-remote --exit-code --tags origin "$NEXT_TAG" > /dev/null 2>&1; then
            echo "::error::Tag $NEXT_TAG already exists on origin. Delete it first if you intend to re-release."
            exit 1
          fi

      # Update package.json (no git tag — we tag manually below).
      # Skip if it already matches (e.g. a prior failed run committed
      # the bump but didn't push the tag).
      - name: Bump package.json
        env:
          NEXT_VERSION: ${{ steps.bump_tag.outputs.next_version }}
        run: |
          current=$(node -p "require('./package.json').version")
          if [ "$current" = "$NEXT_VERSION" ]; then
            echo "package.json already at $NEXT_VERSION, skipping bump"
          else
            npm version "$NEXT_VERSION" --no-git-tag-version
          fi

      - name: Commit & tag
        run: |
          git config --local user.name  "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git add package-lock.json
          git commit -m "chore: bump version to ${{ steps.bump_tag.outputs.next_tag }}" || echo "nothing to commit"
          git tag ${{ steps.bump_tag.outputs.next_tag }}

      # Pushing the tag triggers the Release workflow, which builds, tests,
      # and creates the GitHub Release. Tags pushed locally trigger the same
      # workflow, so this job is just a convenience wrapper around the bump.
      - run: |
          git push origin HEAD:${GITHUB_REF#refs/heads/}
          git push origin ${{ steps.bump_tag.outputs.next_tag }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
