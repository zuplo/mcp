name: Publish to Registries
on:
  release:
    types: [published]

# One in-flight publish per release. If a release gets re-published
# (e.g. delete + recreate), serialize to avoid concurrent npm publishes
# stomping on each other.
concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  id-token: write # Required for OIDC - https://docs.npmjs.com/trusted-publishers
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: npm
          registry-url: https://registry.npmjs.org

      # Pin npm and use --force to avoid the self-upgrade race that leaves
      # a half-installed module tree (Cannot find module 'promise-retry').
      # We need npm 11.5+ for OIDC trusted publishers; 11.5.x is known good.
      - run: npm install -g --force npm@11.5.1
      - run: npm ci
      - run: npm run build

      - name: Publish to NPM
        run: npm publish --access public
      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm config set //npm.pkg.github.com/:_authToken "$NODE_AUTH_TOKEN"
          npm publish --registry https://npm.pkg.github.com
